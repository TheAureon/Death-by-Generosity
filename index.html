<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Death By Generosity</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d1620; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      canvas { display: block; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <!--
      Everything loads as plain scripts IN THIS ORDER, so the game also works
      when you just double-click this file. New files must be added here.
    -->

    <!-- Engine -->
    <script src="vendor/phaser.min.js"></script>

    <!-- Shared namespace (must come before everything else) -->
    <script src="src/core/namespace.js"></script>

    <!-- Editable game content -->
    <script src="data/settings.js"></script>
    <script src="data/tiles.js"></script>
    <script src="data/regions.js"></script>
    <script src="data/maps/test_meadow.js"></script>

    <!-- Generated pixel art -->
    <script src="src/art/artHelpers.js"></script>
    <script src="src/art/palette.js"></script>
    <script src="src/art/tileArt.js"></script>
    <script src="src/art/characterArt.js"></script>
    <script src="src/art/index.js"></script>

    <!-- World + characters -->
    <script src="src/world/mapLoader.js"></script>
    <script src="src/world/worldBuilder.js"></script>
    <script src="src/entities/player.js"></script>

    <!-- Scenes + start -->
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/WorldScene.js"></script>
    <script src="src/scenes/UIScene.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
